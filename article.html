<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M.iTech | المقال</title><link rel="stylesheet" href="style.css"><meta id="articleDesc" name="description" content="M.iTech - أخبار وتغطيات تقنية"><style>.article-wrap{max-width:900px;margin:0 auto}.article-meta{display:flex;gap:10px;flex-wrap:wrap;color:#8f97a7;font-size:13px}.article-hero{width:100%;max-height:560px;object-fit:cover;border-radius:22px;margin:22px 0 28px}.article-excerpt{font-size:20px;line-height:1.9;color:#aab1bd;margin-bottom:28px}.article-content{font-size:18px;line-height:2.05}.article-content p{margin:0 0 20px}.article-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:28px}.article-tags span{background:#1b2130;border-radius:999px;padding:6px 10px;font-size:12px}</style></head><body><header class="nav"><a class="logo" href="index.html">M.i<span>Tech</span></a><nav><a href="index.html">الرئيسية</a><a href="reviews.html">المراجعات</a><a href="news.html">الأخبار</a><a href="exhibitions.html">المعارض</a><a href="videos.html">الفيديوهات</a></nav><a class="nav-btn" href="contact.html">تعاون معنا</a></header><main><section class="section"><div id="article-status" class="muted">جاري تحميل المقال...</div><article id="article" class="article-wrap"></article></section></main><script>const API_BASE="https://mitech-website.eng-mohammede-me.workers.dev";const statusEl=document.getElementById('article-status'),articleEl=document.getElementById('article');function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function paragraphs(text=''){return esc(text).split(/\n\s*\n|\n/g).filter(Boolean).map(p=>`<p>${p}</p>`).join('')}function dateAr(v){const d=new Date(v||'');return Number.isNaN(d.getTime())?'':d.toLocaleDateString('ar-IQ',{year:'numeric',month:'long',day:'numeric'})}async function loadArticle(){const slug=new URLSearchParams(location.search).get('slug');if(!slug){statusEl.textContent='المقال غير محدد.';return}try{const res=await fetch(`${API_BASE}/api/articles?slug=${encodeURIComponent(slug)}&ts=${Date.now()}`,{cache:'no-store'});const data=await res.json();if(!res.ok)throw Error(data.error||'فشل تحميل المقال');const a=data.article;if(!a||a.published===false){statusEl.textContent='المقال غير متوفر.';return}document.title=`M.iTech | ${a.title||'المقال'}`;document.getElementById('articleDesc').content=a.seoDescription||a.excerpt||'';statusEl.textContent='';articleEl.innerHTML=`<div class="eyebrow">${a.type==='exhibition'?'تغطية معرض':'M.iTECH NEWS'}</div><h1 style="font-size:clamp(30px,5vw,52px);line-height:1.25;margin:12px 0 18px">${esc(a.title)}</h1><div class="article-meta">${dateAr(a.createdAt)}${a.exhibitionSlug?`<span>•</span><a href="exhibition.html?slug=${encodeURIComponent(a.exhibitionSlug)}">عرض صفحة المعرض</a>`:''}</div>${a.image?`<img class="article-hero" src="${esc(a.image)}" alt="${esc(a.title)}" loading="eager">`:''}${a.excerpt?`<div class="article-excerpt">${esc(a.excerpt)}</div>`:''}<div class="article-content">${paragraphs(a.content)}</div>${Array.isArray(a.tags)&&a.tags.length?`<div class="article-tags">${a.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}${Array.isArray(a.socialLinks)&&a.socialLinks.length?`<div style="margin-top:30px;padding-top:20px;border-top:1px solid rgba(255,255,255,.08)"><div class="eyebrow">SOCIAL MEDIA</div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">${a.socialLinks.map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer" class="nav-btn">${x.platform==='instagram'?'📸 Instagram':x.platform==='tiktok'?'🎵 TikTok':'▶️ YouTube'}</a>`).join('')}</div></div>`:''}` }catch(e){console.error(e);statusEl.textContent='تعذر تحميل المقال حالياً.'}}loadArticle();</script><script src="site.js"></script></body></html>
