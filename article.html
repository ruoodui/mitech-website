<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M.iTech | المقال</title>
<link rel="stylesheet" href="style.css">
<meta name="description" content="M.iTech - أخبار وتغطيات تقنية">
</head>
<body>
<header class="nav">
  <a class="logo" href="index.html">M.i<span>Tech</span></a>
  <nav>
    <a href="index.html">الرئيسية</a><a href="phones.html">الهواتف</a>
    <a href="reviews.html">المراجعات</a><a href="news.html">الأخبار</a>
    <a href="exhibitions.html">المعارض</a><a href="videos.html">الفيديوهات</a>
  </nav>
  <a class="nav-btn" href="contact.html">تعاون معنا</a>
</header>
<main>
<section class="section">
  <div id="article-status" class="muted">جاري تحميل المقال...</div>
  <article id="article" style="max-width:900px;margin:0 auto;"></article>
</section>
</main>
<script>
const API_BASE = "https://mitech-website.eng-mohammede-me.workers.dev";
const statusEl = document.getElementById("article-status");
const articleEl = document.getElementById("article");

function escapeHtml(value="") {
  return String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[ch]));
}

function paragraphs(text="") {
  return escapeHtml(text)
    .split(/\n\s*\n|\n/g)
    .filter(Boolean)
    .map(p => `<p style="font-size:18px;line-height:2;margin:0 0 18px;">${p}</p>`)
    .join("");
}

async function loadArticle() {
  const slug = new URLSearchParams(location.search).get("slug");
  if (!slug) { statusEl.textContent = "المقال غير محدد."; return; }

  try {
    const res = await fetch(`${API_BASE}/api/articles?slug=${encodeURIComponent(slug)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const a = data.article || data;

    if (!a || a.published === false) {
      statusEl.textContent = "المقال غير متوفر.";
      return;
    }

    document.title = `M.iTech | ${a.title || "المقال"}`;
    statusEl.textContent = "";
    articleEl.innerHTML = `
      <div class="eyebrow">${a.type === "exhibition" ? "تغطية معرض" : "M.iTECH NEWS"}</div>
      <h1 style="font-size:clamp(30px,5vw,52px);line-height:1.25;margin:12px 0 18px;">${escapeHtml(a.title)}</h1>
      ${a.image ? `<img src="${escapeHtml(a.image)}" alt="${escapeHtml(a.title)}" style="width:100%;max-height:520px;object-fit:cover;border-radius:20px;margin:10px 0 28px;">` : ""}
      ${a.excerpt ? `<p class="muted" style="font-size:20px;line-height:1.9;">${escapeHtml(a.excerpt)}</p>` : ""}
      <div style="margin-top:28px;">${paragraphs(a.content)}</div>
    `;
  } catch (e) {
    console.error(e);
    statusEl.textContent = "تعذر تحميل المقال حالياً.";
  }
}
loadArticle();
</script>
<script src="site.js"></script>
</body>
</html>
