<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M.iTech | الأخبار</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="logo" href="index.html">M.i<span>Tech</span></a><nav><a href="index.html">الرئيسية</a><a href="phones.html">الهواتف</a><a href="reviews.html">المراجعات</a><a href="news.html">الأخبار</a><a href="exhibitions.html">المعارض</a><a href="videos.html">الفيديوهات</a></nav><a class="nav-btn" href="contact.html">تعاون معنا</a></header><main><section class="section"><div class="eyebrow">M.iTECH NEWS</div><h1>الأخبار</h1><div id="newsGrid" class="phone-grid"><div class="muted">جاري التحميل...</div></div></section></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));(async()=>{const g=document.getElementById('newsGrid');try{const r=await fetch('/api/content?kind=news&ts='+Date.now(),{cache:'no-store'});const d=await r.json();const a=d.news||[];g.innerHTML=a.map(x=>`<article class="phone-card">${x.image?`<img src="${esc(x.image)}" style="width:100%;height:190px;object-fit:cover;border-radius:14px">`:''}<span class="tag">${esc(x.category||'أخبار')}</span><h3>${esc(x.title)}</h3><p>${esc(x.excerpt||'')}</p>${x.date?`<small>${esc(x.date)}</small>`:''}</article>`).join('')||'<div class="muted">لا توجد أخبار حالياً.</div>'}catch(e){g.innerHTML='<div class="muted">تعذر تحميل الأخبار.</div>'}})();</script><script src="site.js"></script></body></html>
