<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M.iTech | البحث</title><link rel="stylesheet" href="style.css"><style> .search-box{display:flex;gap:10px;max-width:900px;margin:28px auto}.search-box input{flex:1;font-size:18px}.search-results{display:grid;gap:12px;max-width:900px;margin:0 auto}.result{display:block;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:16px;color:inherit;text-decoration:none}.result:hover{border-color:#18d2ff;transform:translateY(-2px)}.result-type{color:#18d2ff;font-size:12px;font-weight:800}.result h3{margin:6px 0}.result p{color:var(--muted);margin:0;line-height:1.7}</style></head><body><header class="nav"><a class="logo" href="index.html">M.i<span>Tech</span></a><nav><a href="index.html">الرئيسية</a><a href="reviews.html">المراجعات</a><a href="news.html">الأخبار</a><a href="exhibitions.html">المعارض</a><a href="videos.html">الفيديوهات</a><a href="search.html">🔎 البحث</a></nav><a class="nav-btn" href="contact.html">تعاون معنا</a></header><main><section class="section"><div class="eyebrow">SEARCH</div><h1>البحث في M.iTech</h1><div class="search-box"><input id="q" placeholder="ابحث عن خبر، معرض، مراجعة، فيديو..." autofocus><button id="go" class="btn primary">بحث</button></div><div id="status" class="muted" style="text-align:center">اكتب كلمة للبحث.</div><div id="results" class="search-results" style="margin-top:18px"></div></section></main><footer><div class="logo">M.i<span>Tech</span></div><p>© 2026 M.iTech — Mohammed Imad. All rights reserved.</p></footer><script>const API='https://mitech-website.eng-mohammede-me.workers.dev';const q=document.getElementById('q'),go=document.getElementById('go'),status=document.getElementById('status'),results=document.getElementById('results');function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function type(t){return ({article:'📰 خبر',exhibition:'🌍 معرض',review:'🎬 مراجعة',video:'🎥 فيديو',photo:'📸 صورة'})[t]||'نتيجة'}async function search(){const term=q.value.trim();if(!term){status.textContent='اكتب كلمة للبحث.';results.innerHTML='';return}status.textContent='جاري البحث...';try{const r=await fetch(API+'/api/search?q='+encodeURIComponent(term)+'&ts='+Date.now(),{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'فشل البحث');const list=d.results||[];status.textContent=list.length?`تم العثور على ${list.length} نتيجة`:'لا توجد نتائج مطابقة.';results.innerHTML=list.map(x=>`<a class="result" href="${esc(x.url)}" ${/^https?:\/\//.test(x.url)?'target="_blank" rel="noopener"':''}><div class="result-type">${type(x.type)}</div><h3>${esc(x.title)}</h3><p>${esc(x.excerpt||'')}</p></a>`).join('')}catch(e){status.textContent=e.message;results.innerHTML=''}}go.onclick=search;q.addEventListener('keydown',e=>{if(e.key==='Enter')search()});const initial=new URLSearchParams(location.search).get('q');if(initial){q.value=initial;search()}</script><script src="site.js"></script></body></html>
