<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M.iTech × Brands</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="logo" href="index.html">M.i<span>Tech</span></a><nav><a href="index.html">الرئيسية</a><a href="phones.html">الهواتف</a><a href="reviews.html">المراجعات</a><a href="news.html">الأخبار</a><a href="exhibitions.html">المعارض</a><a href="videos.html">الفيديوهات</a></nav><a class="nav-btn" href="contact.html">تعاون معنا</a></header><main><section class="section"><div class="eyebrow">M.iTECH × BRANDS</div><h1>الشركات والتعاونات</h1><p class="muted">تغطيات، لقاءات، Press Events ومراجعات مع العلامات التقنية.</p><div id="brandGrid" class="about-grid"></div></section></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));(async()=>{const g=document.getElementById('brandGrid');try{const r=await fetch('/api/content?kind=brands&ts='+Date.now(),{cache:'no-store'});const d=await r.json();const a=d.brands||[];g.innerHTML=a.map(x=>`<article class="about-card">${x.logo?`<img src="${esc(x.logo)}" style="width:100px;height:55px;object-fit:contain">`:''}<strong>${esc(x.name)}</strong><span>${esc(x.type||'')}</span><p>${esc(x.description||'')}</p>${x.link?`<a class="btn ghost" href="${esc(x.link)}" target="_blank" rel="noopener">الشركة</a>`:''}</article>`).join('')||'<div class="muted">أضف أول تعاون من لوحة التحكم.</div>'}catch(e){g.innerHTML='<div class="muted">تعذر تحميل الشركات.</div>'}})();</script><script src="site.js"></script></body></html>
