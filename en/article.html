</style><title>M.iTech | Story</title><meta name="description" content="Technology story from M.iTech."><link rel="alternate" hreflang="ar" href="https://mitechiraq.com/article.html"><link rel="alternate" hreflang="en" href="https://mitechiraq.com/en/article.html"><link rel="canonical" href="https://mitechiraq.com/en/article.html"></head><body><header class="nav"><a class="logo" href="./"><span style="color:inherit">M.i</span><span>Tech</span></a><nav><a href="./">Home</a><a href="reviews.html">Reviews</a><a href="news.html">News</a><a href="exhibitions.html">Events Coverage</a><a href="videos.html">Videos</a></nav><a class="language-switch" href="../article.html" lang="ar" dir="rtl">العربية</a></header><main><section class="section"><div id="article-status" class="muted">Loading story…</div><article id="article" class="article-wrap"></article></section></main><script>const API_BASE='https://mitech-website.eng-mohammede-me.workers.dev';const statusEl=document.getElementById('article-status'),articleEl=document.getElementById('article');function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function paragraphs(t=''){return esc(t).split(/\n\s*\n|\n/g).filter(Boolean).map(p=>`<p>${p}</p>`).join('')}async function load(){const slug=new URLSearchParams(location.search).get('slug');if(!slug){statusEl.textContent='No story selected.';return}try{const r=await fetch(API_BASE+'/api/articles?slug='+encodeURIComponent(slug)+'&ts='+Date.now(),{cache:'no-store'});const d=await r.json();const a=d.article;if(!r.ok||!a||a.published===false)throw Error();document.title='M.iTech | '+(a.titleEn||a.title||'Story');statusEl.textContent='';articleEl.innerHTML=`<div class="eyebrow">${a.type==='exhibition'?'EVENT COVERAGE':'M.iTECH NEWS'}</div><h1>${esc(a.titleEn||a.title)}</h1><div class="article-meta">${a.createdAt?new Date(a.createdAt).toLocaleDateString('en-US'):''}</div>${a.image?`<img class="article-hero" src="${esc(a.image)}" alt="${esc(a.titleEn||a.title)}">`:''}${(a.excerptEn||a.excerpt)?`<div class="article-excerpt">${esc(a.excerptEn||a.excerpt)}</div>`:''}<div class="article-content">${paragraphs(a.contentEn||a.content)}</div>${Array.isArray(a.tags)&&a.tags.length?`<div class="article-tags">${a.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}${Array.isArray(a.socialLinks)&&a.socialLinks.length?`<div style="margin-top:30px;padding-top:20px;border-top:1px solid rgba(255,255,255,.08)"><div class="eyebrow">SOCIAL MEDIA</div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">${a.socialLinks.map(x=>{const platform=String(x.platform||'').toLowerCase();const label=platform==='instagram'?'📸 Instagram':platform==='tiktok'?'🎵 TikTok':platform==='youtube'?'▶️ YouTube':(x.platform||'Watch video');return `<a href="${esc(x.url||'#')}" target="_blank" rel="noopener noreferrer" class="nav-btn">${esc(label)}</a>`}).join('')}</div></div>`:''}` }catch(e){console.error(e);statusEl.textContent='This story is currently unavailable.'}}load();</script><footer><div class="logo">M.i<span>Tech</span></div><p>© 2026 M.iTech — Mohammed Imad. All rights reserved.</p><div class="socials"><a href="https://www.youtube.com/@mitech808" target="_blank" rel="noopener">YouTube</a><a href="https://www.instagram.com/mitech808/" target="_blank" rel="noopener">Instagram</a><a href="https://www.tiktok.com/@m.itech" target="_blank" rel="noopener">TikTok</a><a href="mailto:mohammed@mitechiraq.com">Email</a></div></footer><script src="../site.js"></script></body></html>
