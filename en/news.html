<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b12"><meta name="author" content="Mohammed Imad | M.iTech"><link rel="stylesheet" href="../style.css"><style>
html[dir="ltr"] body{direction:ltr;text-align:left}html[dir="ltr"] .nav{direction:ltr}html[dir="ltr"] .nav nav{gap:clamp(10px,1.5vw,24px)}html[dir="ltr"] .section-head{direction:ltr}html[dir="ltr"] .section-head>p{max-width:520px}.language-switch{display:inline-flex;align-items:center;justify-content:center;padding:9px 13px;border:1px solid rgba(24,210,255,.5);border-radius:12px;color:#6ee7ff;font-weight:800;text-decoration:none;white-space:nowrap}.lang-row{display:flex;justify-content:flex-end;margin:0 0 18px}.page-hero{padding:80px 0 42px}.page-hero h1{font-size:clamp(34px,5vw,58px);line-height:1.12;margin:12px 0}.page-hero p{max-width:760px;color:var(--muted);font-size:18px;line-height:1.8}.press-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.press-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}.press-card h3{margin-top:0}.press-card p{color:var(--muted);line-height:1.8}.muted{color:var(--muted)}@media(max-width:800px){html[dir="ltr"] .nav{flex-wrap:wrap}html[dir="ltr"] .nav nav{order:3;width:100%;overflow-x:auto;padding:8px 0}html[dir="ltr"] .nav-btn{margin-left:auto}}
</style><title>M.iTech | News</title><meta name="description" content="Technology news, product launches and exhibition coverage from M.iTech."><link rel="alternate" hreflang="ar" href="https://mitechiraq.com/news.html"><link rel="alternate" hreflang="en" href="https://mitechiraq.com/en/news.html"><link rel="canonical" href="https://mitechiraq.com/en/news.html"></head><body><header class="nav"><a class="logo" href="./"><span style="color:inherit">M.i</span><span>Tech</span></a><nav><a href="./">Home</a><a href="reviews.html">Reviews</a><a href="news.html">News</a><a href="exhibitions.html">Events Coverage</a><a href="videos.html">Videos</a></nav><a class="language-switch" href="../news.html" lang="ar" dir="rtl">العربية</a></header><main><section class="section"><div class="eyebrow">M.iTECH NEWS</div><h1>Technology news &amp; stories</h1><p class="muted">News, product launches and event reports from M.iTech.</p><div class="news-toolbar" style="display:flex;gap:10px;flex-wrap:wrap;margin:24px 0"><button class="news-filter active" data-filter="all">All</button><button class="news-filter" data-filter="news">News</button><button class="news-filter" data-filter="exhibition">Event coverage</button></div><div id="news-status" class="muted">Loading stories…</div><div id="news-grid" class="news-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:20px"></div></section></main><script>const API_BASE='https://mitech-website.eng-mohammede-me.workers.dev';let allArticles=[],activeFilter='all';const statusEl=document.getElementById('news-status'),gridEl=document.getElementById('news-grid');function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function card(a){return `<a class="exhibition-card" href="article.html?slug=${encodeURIComponent(a.slug)}"><div class="exhibition-cover" style="background-image:url('${String(a.image||'').replace(/'/g,'%27')}')"><span>${a.type==='exhibition'?'EVENT COVERAGE':'NEWS'}</span></div><div class="exhibition-body"><b>${esc(a.title||'')}</b><small>${a.createdAt?new Date(a.createdAt).toLocaleDateString('en-US'):''}</small><p>${esc(a.excerpt||'')}</p></div></a>`}function render(){const arr=allArticles.filter(a=>activeFilter==='all'||(activeFilter==='exhibition'?a.type==='exhibition':a.type!=='exhibition'));gridEl.innerHTML=arr.map(card).join('');statusEl.textContent=arr.length?`${arr.length} stories`:'No matching stories yet.'}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{activeFilter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});(async()=>{try{const r=await fetch(API_BASE+'/api/articles?published=true&ts='+Date.now(),{cache:'no-store'});const d=await r.json();allArticles=(d.articles||[]).filter(a=>a.published!==false);render()}catch(e){statusEl.textContent='Stories could not be loaded.'}})();</script><footer><div class="logo">M.i<span>Tech</span></div><p>© 2026 M.iTech — Mohammed Imad. All rights reserved.</p><div class="socials"><a href="https://www.youtube.com/@mitech808" target="_blank" rel="noopener">YouTube</a><a href="https://www.instagram.com/mitech808/" target="_blank" rel="noopener">Instagram</a><a href="https://www.tiktok.com/@m.itech" target="_blank" rel="noopener">TikTok</a><a href="mailto:mohammed@mitechiraq.com">Email</a></div></footer><script src="../site.js"></script></body></html>
