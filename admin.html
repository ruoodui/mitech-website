<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiTech — لوحة التحكم</title><style>
body{margin:0;background:#08090d;color:#f5f6f8;font-family:Arial,sans-serif}.wrap{max-width:1150px;margin:auto;padding:30px 18px}.card{background:#101218;border:1px solid #292e3b;border-radius:18px;padding:22px;margin-bottom:18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{border:1px solid #292e3b;background:#101218;color:#cbd0da;border-radius:11px;padding:12px 18px;font-weight:700;cursor:pointer}.tab.active{background:#18c9f2;color:#061017}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:700;font-size:13px}input,select,textarea{width:100%;box-sizing:border-box;background:#0b0d12;color:#fff;border:1px solid #333949;border-radius:11px;padding:12px;margin-top:7px;font:inherit}textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:15px}.btn{border:0;border-radius:11px;padding:12px 18px;font-weight:800;cursor:pointer}.primary{background:#18c9f2;color:#061017}.secondary{background:#202531;color:#fff}.danger{background:#4a1d26;color:#ff9aa7}.status{padding:9px 13px;background:#171b24;border-radius:10px;color:#bfc5d0}.ok{color:#63e391}.err{color:#ff7777}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:14px;background:#0b0d12;border:1px solid #252a35;border-radius:12px}.row h3{margin:0 0 5px}.muted{color:#969dac}.hidden{display:none}.media-preview{max-width:180px;max-height:110px;border-radius:10px;margin-top:10px}.help{font-size:12px;color:#8f97a7;margin-top:6px}@media(max-width:700px){.grid{grid-template-columns:1fr}.row{display:block}.row .actions{margin-top:10px}}
</style></head><body><div class="wrap">
<div class="card"><h1>لوحة تحكم M.iTech</h1><div class="muted">إدارة المراجعات وتغطيات المعارض والصور والفيديوهات من مكان واحد.</div></div>
<div class="tabs"><button class="tab active" data-tab="reviews">🎬 المراجعات</button><button class="tab" data-tab="exhibitions">🌍 المعارض</button><button class="tab" data-tab="media">📸 الصور والفيديوهات</button></div>
<section id="reviews" class="panel"><div class="card"><h2>إضافة مراجعة</h2><div class="grid"><label>رمز الإدارة<input id="rk" type="password"></label><label>العنوان<input id="rt" placeholder="مراجعة Galaxy S26 Ultra"></label><label>الجهاز<input id="rd" placeholder="Samsung Galaxy S26 Ultra"></label><label>رابط YouTube<input id="ry" placeholder="https://www.youtube.com/watch?v=..."></label><label>التاريخ<input id="rdate" type="date"></label></div><label style="margin-top:14px">الوصف<textarea id="rdesc"></textarea></label><div class="actions"><button class="btn primary" id="addReview">إضافة</button><span id="rs" class="status">جاهز</span></div></div><div class="card"><h2>المراجعات الحالية</h2><div id="reviewList" class="list"></div></div></section>
<section id="exhibitions" class="panel hidden"><div class="card"><h2>إضافة معرض</h2><div class="grid"><label>رمز الإدارة<input id="ek" type="password"></label><label>اسم المعرض<input id="et" placeholder="IFA Berlin 2026 🇩🇪"></label><label>Slug<input id="es" placeholder="ifa-berlin-2026"></label><label>الموقع<input id="el" placeholder="Berlin, Germany"></label><label>التاريخ<input id="edate" placeholder="3–7 September 2026"></label><label>الحالة<input id="estatus" value="LIVE COVERAGE"></label><label>صورة الغلاف URL<input id="ecover" placeholder="https://..."></label></div><label style="margin-top:14px">الوصف<textarea id="edesc" placeholder="تغطية M.iTech من قلب المعرض..."></textarea></label><div class="actions"><button class="btn primary" id="addEx">إضافة المعرض</button><span id="esx" class="status">جاهز</span></div></div><div class="card"><h2>المعارض الحالية</h2><div id="exList" class="list"></div></div></section>
<section id="media" class="panel hidden"><div class="card"><h2>إضافة صورة أو فيديو</h2><div class="grid"><label>رمز الإدارة<input id="mk" type="password"></label><label>المعرض<select id="mex"></select></label><label>نوع المحتوى<select id="mtype"><option value="image">📸 صورة</option><option value="video">🎥 YouTube</option></select></label><label>العنوان<input id="mtitle" placeholder="Dreame Booth / Hands-on..."></label></div><div id="imageBox" style="margin-top:14px"><label>اختر صورة من جهازك<input id="mfile" type="file" accept="image/*"></label><div class="help">الصورة تُرفع إلى مستودع GitHub تلقائياً.</div></div><div id="videoBox" class="hidden" style="margin-top:14px"><label>رابط YouTube<input id="murl" placeholder="https://www.youtube.com/watch?v=..."></label></div><div class="actions"><button class="btn primary" id="addMedia">إضافة للموقع</button><span id="ms" class="status">جاهز</span></div></div><div class="card"><h2>المحتوى الحالي</h2><div id="mediaList" class="list"></div></div></section>
</div><script>
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let reviews=[],exhibitions=[];
for(const b of document.querySelectorAll('.tab'))b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.panel').forEach(x=>x.classList.add('hidden'));$(b.dataset.tab).classList.remove('hidden');if(b.dataset.tab==='reviews')loadReviews();if(b.dataset.tab==='exhibitions')loadEx();if(b.dataset.tab==='media'){loadEx().then(loadMedia)}};
$('rdate').value=new Date().toISOString().slice(0,10);
async function api(path,opt={}){const r=await fetch('https://mitech-website.eng-mohammede-me.workers.dev'+path+'?ts='+Date.now(),{cache:'no-store',...opt});const d=await r.json();if(!r.ok)throw Error(d.error||'فشل الطلب');return d}
function status(id,t,c=''){ $(id).textContent=t;$(id).className='status '+c }
async function loadReviews(){try{const d=await api('/api/reviews');reviews=Array.isArray(d)?d:(d.reviews||[]);$('reviewList').innerHTML=reviews.map((r,i)=>`<div class="row"><div><h3>${esc(r.title)}</h3><div class="muted">${esc(r.device||'')} ${r.date?'• '+esc(r.date):''}</div><div class="muted">${esc(r.youtube||'')}</div></div><button class="btn danger" onclick="delReview(${i})">حذف</button></div>`).join('')||'<div class="muted">لا توجد مراجعات.</div>'}catch(e){$('reviewList').innerHTML='<div class="err">'+esc(e.message)+'</div>'}}
$('addReview').onclick=async()=>{try{status('rs','جاري الحفظ...');const d=await api('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':$('rk').value.trim()},body:JSON.stringify({title:$('rt').value.trim(),youtube:$('ry').value.trim(),device:$('rd').value.trim(),description:$('rdesc').value.trim(),date:$('rdate').value})});reviews=d.reviews||[];$('rt').value=$('rd').value=$('ry').value=$('rdesc').value='';status('rs','تمت الإضافة ✓','ok');loadReviews()}catch(e){status('rs',e.message,'err')}};
window.delReview=async i=>{try{status('rs','جاري الحذف...');const d=await api('/api/reviews',{method:'DELETE',headers:{'Content-Type':'application/json','X-Admin-Key':$('rk').value.trim()},body:JSON.stringify({youtube:reviews[i].youtube,title:reviews[i].title})});reviews=d.reviews||[];status('rs','تم الحذف ✓','ok');loadReviews()}catch(e){status('rs',e.message,'err')}};
async function loadEx(){try{const d=await api('/api/exhibitions');exhibitions=Array.isArray(d)?d:(d.exhibitions||[]);$('exList').innerHTML=exhibitions.map((x,i)=>`<div class="row"><div><h3>${esc(x.title)}</h3><div class="muted">${esc(x.location||'')} ${x.date?'• '+esc(x.date):''}</div><div class="muted">${(x.media||[]).length} مواد</div></div><div class="actions"><button class="btn secondary" onclick="openExhibitionEdit(${i})">✏️ تعديل</button><button class="btn danger" onclick="delEx(${i})">حذف</button></div></div>`).join('')||'<div class="muted">لا توجد معارض.</div>';$('mex').innerHTML=exhibitions.map((x,i)=>`<option value="${i}">${esc(x.title)}</option>`).join('')}catch(e){$('exList').innerHTML='<div class="err">'+esc(e.message)+'</div>'}}
$('addEx').onclick=async()=>{try{status('esx','جاري الحفظ...');await api('/api/exhibitions',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':$('ek').value.trim()},body:JSON.stringify({action:'add-exhibition',title:$('et').value.trim(),slug:$('es').value.trim(),location:$('el').value.trim(),date:$('edate').value.trim(),status:$('estatus').value.trim(),cover:$('ecover').value.trim(),description:$('edesc').value.trim()})});status('esx','تمت إضافة المعرض ✓','ok');loadEx()}catch(e){status('esx',e.message,'err')}};
window.delEx=async i=>{try{if(!confirm('حذف المعرض وكل محتواه؟'))return;status('esx','جاري الحذف...');await api('/api/exhibitions',{method:'DELETE',headers:{'Content-Type':'application/json','X-Admin-Key':$('ek').value.trim()},body:JSON.stringify({action:'delete-exhibition',slug:exhibitions[i].slug})});status('esx','تم الحذف ✓','ok');loadEx()}catch(e){status('esx',e.message,'err')}};
$('mtype').onchange=()=>{$('imageBox').classList.toggle('hidden',$('mtype').value!=='image');$('videoBox').classList.toggle('hidden',$('mtype').value!=='video')};
async function loadMedia(){const x=exhibitions[$('mex').value||0];$('mediaList').innerHTML=x?(x.media||[]).map((m,i)=>`<div class="row"><div><b>${esc(m.title||'')}</b><div class="muted">${m.type==='video'?'🎥 فيديو':'📸 صورة'}</div></div><button class="btn danger" onclick="delMedia(${i})">حذف</button></div>`).join('')||'<div class="muted">لا يوجد محتوى.</div>':'<div class="muted">أضف معرضاً أولاً.</div>'}
$('mex').onchange=loadMedia;
$('addMedia').onclick=async()=>{try{const x=exhibitions[$('mex').value||0];if(!x)throw Error('اختار معرضاً');status('ms','جاري الرفع...');let body={action:'add-media',slug:x.slug,type:$('mtype').value,title:$('mtitle').value.trim()};if(body.type==='video'){body.url=$('murl').value.trim();if(!body.url)throw Error('أدخل رابط YouTube')}else{const f=$('mfile').files[0];if(!f)throw Error('اختار صورة');if(f.size>8*1024*1024)throw Error('الصورة أكبر من 8MB');body.filename=f.name;body.data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}const d=await api('/api/exhibitions',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':$('mk').value.trim()},body:JSON.stringify(body)});exhibitions=d.exhibitions||[];$('mtitle').value=$('murl').value='';$('mfile').value='';status('ms','تمت الإضافة ✓','ok');loadEx().then(loadMedia)}catch(e){status('ms',e.message,'err')}};
window.delMedia=async i=>{try{const x=exhibitions[$('mex').value||0];await api('/api/exhibitions',{method:'DELETE',headers:{'Content-Type':'application/json','X-Admin-Key':$('mk').value.trim()},body:JSON.stringify({action:'delete-media',slug:x.slug,index:i})});status('ms','تم الحذف ✓','ok');loadEx().then(loadMedia)}catch(e){status('ms',e.message,'err')}};
loadReviews();loadEx();
</script>
<style>
.ex-edit-btn{background:#23283a;color:#fff;border:1px solid #3a4358;padding:8px 12px;border-radius:9px;cursor:pointer}.ex-edit-btn:hover{border-color:#18c9f2}
.ex-edit-btn:hover{border-color:#7c5cff}
#editExModal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}
#editExModal.show{display:flex}
.ex-edit-box{width:min(620px,100%);max-height:90vh;overflow:auto;background:#11141c;border:1px solid #30384a;border-radius:20px;padding:24px}
.ex-edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ex-edit-grid .full{grid-column:1/-1}
.ex-edit-box label{display:block;color:#b8becb;font-size:12px;margin-bottom:5px}
.ex-edit-box input,.ex-edit-box textarea,.ex-edit-box select{width:100%;background:#090b10;color:#fff;border:1px solid #303746;border-radius:9px;padding:10px;font-family:inherit}
.ex-edit-box textarea{min-height:100px}
.ex-edit-actions{display:flex;gap:8px;margin-top:16px}
@media(max-width:650px){.ex-edit-grid{grid-template-columns:1fr}.ex-edit-grid .full{grid-column:auto}}
</style>
<div id="editExModal">
<div class="ex-edit-box">
<h3>✏️ تعديل المعرض</h3>
<div class="ex-edit-grid">
<div class="full"><label>اسم المعرض</label><input id="editExName"></div>
<div><label>Slug</label><input id="editExSlug"></div>
<div><label>الحالة</label><select id="editExStatus"><option>COMING SOON</option><option>LIVE COVERAGE</option><option>COVERAGE</option></select></div>
<div><label>التاريخ</label><input id="editExDate"></div>
<div><label>الموقع</label><input id="editExLocation"></div>
<div class="full"><label>صورة الغلاف</label><input id="editExImage"></div>
<div class="full"><label>الوصف</label><textarea id="editExDescription"></textarea></div>
</div>
<div class="ex-edit-actions"><button class="btn primary" onclick="saveExhibitionEdit()">حفظ التعديل</button><button class="btn" onclick="closeExhibitionEdit()">إلغاء</button></div>
</div></div>
<script>
let editingExhibitionIndex=-1;
function openExhibitionEdit(i){
 const list=window.exhibitions||window.exhibitionData||[];
 const x=list[i]; if(!x)return;
 editingExhibitionIndex=i;
 editExName.value=x.name||x.title||''; editExSlug.value=x.slug||'';
 editExStatus.value=x.status||'COVERAGE'; editExDate.value=x.date||x.dates||'';
 editExLocation.value=x.location||''; editExImage.value=x.image||x.cover||x.coverImage||'';
 editExDescription.value=x.description||'';
 editExModal.classList.add('show');
}
function closeExhibitionEdit(){editExModal.classList.remove('show');editingExhibitionIndex=-1}
async function saveExhibitionEdit(){
 const old=exhibitions[editingExhibitionIndex]; if(!old)return;
 const title=editExName.value.trim(), slug=editExSlug.value.trim();
 if(!title||!slug){alert('اسم المعرض وSlug مطلوبان');return}
 try{
   const key=$('ek').value.trim();
   if(!key){alert('أدخل رمز الإدارة أولاً');return}
   status('esx','جاري حفظ التعديل...');
   const d=await api('/api/exhibitions',{
     method:'POST',
     headers:{'Content-Type':'application/json','X-Admin-Key':key},
     body:JSON.stringify({
       action:'update-exhibition',
       oldSlug:old.slug,
       title,
       slug,
       location:editExLocation.value.trim(),
       date:editExDate.value.trim(),
       status:editExStatus.value,
       cover:editExImage.value.trim(),
       description:editExDescription.value.trim()
     })
   });
   exhibitions=d.exhibitions||[];
   closeExhibitionEdit();
   status('esx','تم تعديل المعرض ✓','ok');
   await loadEx();
 }catch(e){status('esx',e.message,'err')}
}
</script>

</body></html>
