<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiTech — إدارة الأسعار</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body{margin:0;background:#08090d;color:#f5f6f8;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:40px 20px}.card{background:#101218;border:1px solid #292e3b;border-radius:18px;padding:24px;margin-bottom:18px}h1{margin:0 0 8px;font-size:34px}.muted{color:#969dac}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}input{width:100%;box-sizing:border-box;background:#0b0d12;color:white;border:1px solid #333949;border-radius:11px;padding:13px;margin-top:7px}.drop{border:1px dashed #41495b;border-radius:14px;padding:25px;text-align:center;margin-top:18px}.actions{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:13px 20px;font-weight:700;cursor:pointer}.primary{background:#18c9f2;color:#061017}.secondary{background:#202531;color:white}.status{padding:10px 14px;background:#171b24;border-radius:10px}.ok{color:#63e391}.err{color:#ff7777}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{padding:10px;border-bottom:1px solid #252a35;text-align:right;white-space:nowrap}th{color:#18d2ff}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="card"><h1>إدارة أسعار MiTech</h1><div class="muted">ارفع ملف Excel، راجع البيانات، ثم حدّث الأسعار على الموقع.</div></div>
<div class="card">
<div class="grid">
<label>رمز الإدارة<input id="key" type="password" placeholder="أدخل رمز الإدارة"></label>
<label>تاريخ الأسعار<input id="date" type="date"></label>
</div>
<div class="drop"><b>ملف Excel</b><input id="file" type="file" accept=".xlsx,.xls,.csv"><div id="fname" class="muted"></div></div>
<div class="actions"><button class="btn primary" id="preview">معاينة الملف</button><button class="btn secondary" id="publish" disabled>تحديث الأسعار بالموقع</button><span id="status" class="status">بانتظار الملف</span></div>
</div>
<div class="card"><b>المعاينة</b><span id="count" class="muted"> — 0 جهاز</span><div style="overflow:auto"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div></div>
</div>
<script>
const $=x=>document.getElementById(x); let rows=[];
$("date").value=new Date().toISOString().slice(0,10);
$("file").onchange=e=>{$("fname").textContent=e.target.files[0]?.name||"";$("publish").disabled=true};
const norm=s=>String(s??"").trim().toLowerCase().replace(/[()]/g,"").replace(/[_-]/g," ").replace(/\s+/g," ");
function pick(o,names){const m={};Object.keys(o).forEach(k=>m[norm(k)]=o[k]);for(const n of names){const v=m[norm(n)];if(v!==undefined&&v!=="")return v}return ""}
function convert(data){return data.map(r=>({name:String(pick(r,["الاسم (name)","الاسم","name","اسم الجهاز","phone"])).trim(),ram:String(pick(r,["الرام والذاكره","الرام والذاكرة","ram & memory","ram","memory"])).trim(),price:pick(r,["السعر (price)","السعر","price","سعر"]),brand:String(pick(r,["الماركه (Brand)","الماركة (Brand)","الماركه","الماركة","brand"])).trim(),store:String(pick(r,["المتجر","store","shop"])).trim(),address:String(pick(r,["العنوان","address","location"])).trim()})).filter(x=>x.name)}
function render(){let c=["name","brand","ram","price","store","address"],t={name:"الجهاز",brand:"الماركة",ram:"الرام/الذاكرة",price:"السعر",store:"المتجر",address:"العنوان"};$("head").innerHTML=c.map(x=>"<th>"+t[x]+"</th>").join("");$("body").innerHTML=rows.slice(0,100).map(r=>"<tr>"+c.map(x=>"<td>"+String(r[x]??"")+"</td>").join("")+"</tr>").join("");$("count").textContent=" — "+rows.length+" جهاز"}
function stat(s,cl=""){$("status").textContent=s;$("status").className="status "+cl}
$("preview").onclick=async()=>{let f=$("file").files[0];if(!f)return stat("اختار ملف Excel أولاً","err");try{let b=await f.arrayBuffer(),w=XLSX.read(b,{type:"array"}),d=XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{defval:""});rows=convert(d);if(!rows.length)throw Error("لم أجد عمود اسم الجهاز");render();$("publish").disabled=false;stat("تمت قراءة "+rows.length+" جهاز — جاهز للنشر","ok")}catch(e){stat(e.message,"err")}};
$("publish").onclick=async()=>{let key=$("key").value.trim();if(!key)return stat("أدخل رمز الإدارة","err");if(!rows.length)return; if(!confirm("تحديث "+rows.length+" جهاز؟"))return;$("publish").disabled=true;stat("جاري التحديث...");try{let r=await fetch("/api/update-prices",{method:"POST",headers:{"Content-Type":"application/json","X-Admin-Key":key},body:JSON.stringify({updatedAt:$("date").value,phones:rows})}),d=await r.json();if(!r.ok)throw Error(d.error||"فشل التحديث");stat("تم تحديث الأسعار بنجاح ✓","ok")}catch(e){stat(e.message,"err");$("publish").disabled=false}};
</script>
</body></html>
