<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiTech | المراجعات</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="logo" href="index.html">M.i<span>Tech</span></a><nav><a href="index.html">الرئيسية</a><a href="phones.html">الهواتف</a><a href="prices.html">الأسعار</a><a href="reviews.html">المراجعات</a><a href="videos.html">الفيديوهات</a><a href="contact.html">تواصل</a></nav><a class="nav-btn" href="contact.html">تعاون معنا</a></header><main><section class="section alt"><div class="section-head"><div><div class="eyebrow">REVIEWS</div><h2>أحدث المراجعات</h2></div><p>تجارب الأجهزة والاختبارات العملية من MiTech.</p></div><div class="review-grid" id="reviewsGrid">
  <div class="muted" id="reviewsLoading">جاري تحميل المراجعات...</div>
</div></section></main><footer><div class="logo">M.i<span>Tech</span></div><p>© 2026 M.iTech — Mohammed Imad. All rights reserved.</p><div class="socials"><a href="https://www.youtube.com/@mitech808">YouTube</a><a href="https://www.instagram.com/mitech808/">Instagram</a><a href="https://www.tiktok.com/@m.itech">TikTok</a></div></footer>
<script>
(function(){
  const grid=document.getElementById("reviewsGrid");

  function esc(v){
    return String(v ?? "").replace(/[&<>"']/g,m=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[m]));
  }

  function youtubeId(url){
    const s=String(url||"").trim();
    const m=s.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
    return m ? m[1] : "";
  }

  function render(data){
    const list=Array.isArray(data) ? data : (Array.isArray(data.reviews) ? data.reviews : []);
    if(!list.length){
      grid.innerHTML='<div class="muted">لا توجد مراجعات حالياً.</div>';
      return;
    }

    grid.innerHTML=list.map(r=>{
      const title=r.title || r.name || "مراجعة";
      const device=r.device || r.phone || "";
      const desc=r.description || r.desc || "تجربة ومراجعة الجهاز بشكل عملي.";
      const date=r.date || r.created_at || "";
      const yt=r.youtube || r.youtube_url || r.url || "";
      const id=youtubeId(yt);

      return `
        <article class="review">
          ${id ? `
            <div class="review-video" style="position:relative;aspect-ratio:16/9;background:#111;overflow:hidden">
              <iframe
                src="https://www.youtube.com/embed/${esc(id)}"
                title="${esc(title)}"
                loading="lazy"
                style="width:100%;height:100%;border:0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen></iframe>
            </div>
          ` : ""}
          <div class="review-body">
            <span class="tag">مراجعة</span>
            <h3>${esc(title)}</h3>
            ${device ? `<p>${esc(device)}</p>` : ""}
            <p>${esc(desc)}</p>
            ${date ? `<small>${esc(date)}</small>` : ""}
          </div>
        </article>
      `;
    }).join("");
  }

  fetch("reviews.json?ts="+Date.now(), {cache:"no-store"})
    .then(r=>{
      if(!r.ok) throw new Error("HTTP "+r.status);
      return r.json();
    })
    .then(render)
    .catch(err=>{
      console.error("reviews.json:",err);
      grid.innerHTML='<div class="muted">تعذر تحميل المراجعات حالياً.</div>';
    });
})();
</script>
</body></html>
