<script>
function ytId(u){const m=String(u||'').match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);return m?m[1]:''}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
(async()=>{const g=document.getElementById('reviewsGrid');try{const r=await fetch('https://mitech-website.eng-mohammede-me.workers.dev/api/reviews?ts='+Date.now(),{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'فشل التحميل');const a=Array.isArray(d)?d:(d.reviews||[]);if(!a.length){g.innerHTML='<div class="muted">لا توجد مراجعات حالياً.</div>';return}g.innerHTML=a.map(x=>{const id=ytId(x.youtube);return `<article class="review"><div class="review-video" style="aspect-ratio:16/9;background:#111">${id?`<iframe src="https://www.youtube.com/embed/${id}" title="${esc(x.title)}" loading="lazy" allowfullscreen style="width:100%;height:100%;border:0"></iframe>`:''}</div><div class="review-body"><span class="tag">مراجعة</span><h3>${esc(x.title)}</h3><p>${esc(x.device||'')} ${x.description?'— '+esc(x.description):''}</p>${x.date?`<small>${esc(x.date)}</small>`:''}</div></article>`}).join('')}catch(e){g.innerHTML='<div class="muted">تعذر تحميل المراجعات حالياً.</div>'}})();
