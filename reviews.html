<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M.iTech | المراجعات</title><link rel="stylesheet" href="style.css"></head><body>
<header class="nav"><a class="logo" href="index.html">M.i<span>Tech</span></a><nav><a href="index.html">الرئيسية</a><a href="phones.html">الهواتف</a><a href="reviews.html">المراجعات</a><a href="news.html">الأخبار</a><a href="exhibitions.html">المعارض</a><a href="videos.html">الفيديوهات</a></nav><a class="nav-btn" href="contact.html">تعاون معنا</a></header>
<main><section class="section alt"><div class="section-head"><div><div class="eyebrow">REVIEWS</div><h2>أحدث المراجعات</h2></div><p>تجارب الأجهزة والاختبارات العملية من M.iTech.</p></div><div id="reviewsGrid" class="review-grid"><div class="muted">جاري تحميل المراجعات...</div></div></section></main>
<footer><div class="logo">M.i<span>Tech</span></div><p>© 2026 M.iTech — Mohammed Imad. All rights reserved.</p><div class="socials"><a href="https://www.youtube.com/@mitech808">YouTube</a><a href="https://www.instagram.com/mitech808/">Instagram</a><a href="https://www.tiktok.com/@m.itech">TikTok</a></div></footer>
<script>
function ytId(u){const m=String(u||'').match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);return m?m[1]:''}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
(async()=>{const g=document.getElementById('reviewsGrid');try{const r=await fetch('/api/reviews?ts='+Date.now(),{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'فشل التحميل');const a=Array.isArray(d)?d:(d.reviews||[]);if(!a.length){g.innerHTML='<div class="muted">لا توجد مراجعات حالياً.</div>';return}g.innerHTML=a.map(x=>{const id=ytId(x.youtube);return `<article class="review"><div class="review-video" style="aspect-ratio:16/9;background:#111">${id?`<iframe src="https://www.youtube.com/embed/${id}" title="${esc(x.title)}" loading="lazy" allowfullscreen style="width:100%;height:100%;border:0"></iframe>`:''}</div><div class="review-body"><span class="tag">مراجعة</span><h3>${esc(x.title)}</h3><p>${esc(x.device||'')} ${x.description?'— '+esc(x.description):''}</p>${x.date?`<small>${esc(x.date)}</small>`:''}</div></article>`}).join('')}catch(e){g.innerHTML='<div class="muted">تعذر تحميل المراجعات حالياً.</div>'}})();
</script><script src="site.js"></script></body></html>
