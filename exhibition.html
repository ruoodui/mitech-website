<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M.iTech | تغطية المعرض</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="logo" href="index.html">M.i<span>Tech</span></a><nav><a href="index.html">الرئيسية</a><a href="phones.html">الهواتف</a><a href="reviews.html">المراجعات</a><a href="news.html">الأخبار</a><a href="exhibitions.html">المعارض</a><a href="videos.html">الفيديوهات</a></nav><a class="nav-btn" href="contact.html">تعاون معنا</a></header><main class="exhibition-page"><section id="hero" class="hero-mini"><div class="eyebrow">LIVE COVERAGE</div><h1>جاري التحميل...</h1><p></p></section><section class="section"><div class="section-head"><div><div class="eyebrow">MEDIA</div><h2>صور وفيديوهات</h2></div><p id="desc"></p></div><div id="media" class="media-grid"></div></section></main><footer><div class="logo">M.i<span>Tech</span></div><p>© 2026 M.iTech — Mohammed Imad. All rights reserved.</p></footer><script>
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function ytId(u){const m=String(u||'').match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);return m?m[1]:''}(async()=>{const slug=new URLSearchParams(location.search).get('slug');try{const r=await fetch('/api/exhibitions?ts='+Date.now(),{cache:'no-store'});const d=await r.json();const a=Array.isArray(d)?d:(d.exhibitions||[]);const x=a.find(v=>v.slug===slug)||a[0];if(!x)throw Error();document.title='M.iTech | '+x.title;document.querySelector('#hero h1').textContent=x.title;document.querySelector('#hero p').textContent=(x.location||'')+(x.date?' • '+x.date:'')+' — '+(x.status||'COVERAGE');document.getElementById('desc').textContent=x.description||'';const m=x.media||[];document.getElementById('media').innerHTML=m.map(v=>{const id=ytId(v.url);return `<article class="media-card">${v.type==='video'&&id?`<div class="media-video"><iframe src="https://www.youtube.com/embed/${id}" title="${esc(v.title||x.title)}" loading="lazy" allowfullscreen></iframe></div>`:v.type==='image'?`<img src="${esc(v.url)}" alt="${esc(v.title||x.title)}" loading="lazy">`:''}<div class="body"><span class="pill">${v.type==='video'?'VIDEO':'PHOTO'}</span><div>${esc(v.title||'')}</div></div></article>`}).join('')||'<div class="muted">لا توجد مواد مضافة بعد.</div>'}catch(e){document.querySelector('#hero h1').textContent='التغطية غير متوفرة';}})();</script><script src="site.js"></script></body></html>
